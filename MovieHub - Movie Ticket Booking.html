*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:10px 16px;overflow-x:auto}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--pr),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:12px;white-space:nowrap}
nav button{border:0;background:none;color:var(--mu);font:600 14px inherit;padding:8px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav button.on,nav button:hover{background:rgba(123,47,247,.14);color:var(--p2)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h2{margin:6px 0 4px}.sub{color:var(--mu);margin:0 0 18px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;font-size:12px}
.steps span{padding:4px 10px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);color:var(--mu)}
.steps span.d{background:var(--ok);color:#fff;border-color:var(--ok)}
.hero{border-radius:20px;padding:48px 28px;color:#fff;background:linear-gradient(135deg,#e50f4d,#7b2ff7 70%,#1e1b4b)}
.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 10px}.hero p{max-width:520px;opacity:.9}
.btn{border:0;border-radius:12px;padding:12px 22px;font:700 15px inherit;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--pr),var(--p2))}
.btn.g{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(123,47,247,.18)}
.card.dis{opacity:.55;cursor:not-allowed}.card.dis:hover{transform:none;box-shadow:none}
.poster{height:150px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:10px}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);margin:3px 3px 0 0;color:var(--mu)}
.tag.ok{color:var(--ok)}.tag.no{color:var(--pr)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--cd);cursor:pointer;font-weight:600;font-size:13px;color:var(--tx)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mu);margin:10px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.screen{height:10px;border-radius:50%/100%;background:linear-gradient(90deg,var(--pr),var(--p2));margin:8px auto 4px;width:70%;max-width:460px}
.hall{overflow:auto;max-height:520px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px}
.row{display:flex;gap:4px;margin-bottom:4px;align-items:center;width:max-content;margin-inline:auto}
.rl{width:26px;font-size:11px;color:var(--mu);font-weight:700;text-align:center}
.s{width:30px;height:26px;border:0;border-radius:6px 6px 3px 3px;background:var(--seat);font-size:9px;color:var(--tx);cursor:pointer;padding:0}
.s.sel{background:var(--ok);color:#fff;transform:scale(1.1)}.s.bk{background:#c0c3d0;opacity:.45;cursor:not-allowed;text-decoration:line-through}
.bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-top:14px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.pm{border:2px solid var(--bd);border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:var(--cd);font-weight:700}
.pm.on{border-color:var(--pr);background:rgba(229,15,77,.08)}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.ov{position:fixed;inset:0;background:rgba(10,10,20,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:f .2s}
.mod{background:var(--cd);color:var(--tx);border-radius:20px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow:auto;text-align:center;animation:u .25s}
.mod .ic{font-size:44px}.mod h3{margin:6px 0}.mod .bd{color:var(--mu);font-size:14px;text-align:left}
.mod .act{display:flex;gap:8px;margin-top:16px;justify-content:center}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd);gap:10px}.kv b{color:var(--tx);text-align:right}
.stars{font-size:38px;cursor:pointer;color:#c9ccd8;user-select:none}.stars span.on{color:#f5b301}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b1d2a;color:#fff;padding:10px 18px;border-radius:24px;z-index:60;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;animation:u .2s;max-width:90%;text-align:center}
.spin{width:40px;height:40px;border:4px solid var(--bd);border-top-color:var(--pr);border-radius:50%;margin:10px auto;animation:r 1s linear infinite}
@keyframes f{from{opacity:0}}@keyframes u{from{opacity:0;transform:translateY(14px)}}@keyframes r{to{transform:rotate(360deg)}}
.rh{display:flex;justify-content:space-between;align-items:baseline;margin-top:28px}.rh a{color:var(--pr);cursor:pointer;font-weight:600}
.rw{position:relative}.rr{display:flex;gap:18px;overflow-x:auto;scroll-behavior:smooth;padding:4px 0 8px;scrollbar-width:none}.rr::-webkit-scrollbar{display:none}
.rc{flex:0 0 220px;border-radius:10px;overflow:hidden;background:#000;cursor:pointer;transition:.15s}.rc:hover{transform:translateY(-4px)}
.rp{height:328px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;color:#fff}
.pro{position:absolute;top:0;right:0;background:#e5304a;color:#fff;font-size:13px;padding:3px 10px;border-radius:0 0 0 6px}
.rt{font-weight:900;font-size:30px;letter-spacing:1px;text-transform:uppercase;line-height:1.05;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.rs{font-size:11px;letter-spacing:4px;margin-top:8px;opacity:.9}
.rf{background:#0b0b0b;color:#fff;padding:12px;font-size:15px;display:flex;gap:8px;align-items:center;height:46px}
.nx{position:absolute;right:-8px;top:42%;width:48px;height:48px;border-radius:50%;background:#3a3a3a;color:#fff;border:0;font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.hm{background:linear-gradient(#ebe8ff,var(--bg) 420px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) body.hm{background:linear-gradient(#1c1836,var(--bg) 420px)}}
:root[data-theme=dark] body.hm{background:linear-gradient(#1c1836,var(--bg) 420px)}
nav::after{content:"👤";margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;flex:none}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.mc{background:var(--cd);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}.mc:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(123,47,247,.18)}
.mp{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;color:#fff}
.mp .rt{font-size:26px;word-break:break-word}
.mi{padding:12px}.mi b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.25;min-height:38px;margin-bottom:4px}.mi span{font-size:12px;color:var(--mu)}
.er{display:flex;gap:20px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none}.er::-webkit-scrollbar{display:none}

.dots{display:flex;justify-content:center;align-items:center;gap:6px;margin:18px 0 8px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--bd)}.dots i:first-child{background:var(--tx)}
.dots button{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--cd);color:var(--tx);cursor:pointer}
footer{background:#0d0f1a;color:#aab0c5;padding:36px 16px 20px;margin-top:30px;font-size:14px}
.fg{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:24px}
.fg h4{color:#fff;margin:0 0 10px}.fg div div{margin:6px 0}
.fb{max-width:1100px;margin:24px auto 0;padding-top:16px;border-top:1px solid #272a3c;font-size:12px}
.mh{display:flex;gap:16px;align-items:center;margin-bottom:16px}.mpo{width:76px;height:104px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}

.tr{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}

.pill{min-width:92px;padding:9px 6px;border-radius:8px;background:var(--cd);font:600 13px inherit;cursor:pointer;border:1px solid}

.chip.on{background:#ffcc00;color:#17202a;border-color:#ffcc00}.pm.on{border-color:#f1b900;background:rgba(255,204,0,.12)}

.mp{aspect-ratio:2/3}

function home(){const f=FEAT[S.hi||0],i=MV.findIndex(x=>x.n===f.n),m=MV[i],c=CL[f.n],p=PS[f.n]||[f.t,'','#fff'];
return`<section class="hh" style="--h1:${f.a};--h2:${f.b}"><div class="hi"><div class="ht"><h1>${f.t}</h1><div class="hm2">${c[0]} | ${c[1]} | ${m.d}</div><p>${f.s}</p><div class="gc">${f.g.map(g=>`<span>${g}</span>`).join('')}</div><div class="rl2">${f.r}</div><button class="wb" onclick="want(${i})">Book Tickets</button></div>
<div class="hp" style="${bg(m)}" onclick="want(${i})">${IMG[m.n]?'':`<div class="rt" style="color:${p[2]}">${p[0]}</div><div class="rs">${p[1]}</div>`}<div class="pl">▶</div></div></div>
<div class="hd">${FEAT.map((_,k)=>`<i class="${k===(S.hi||0)?'on':''}" onclick="S.hi=${k};render()"></i>`).join('')}</div></section>
<div class="wrap"><h2>Now Showing</h2><p class="sub">Grab the best seats at theatres around you</p><div class="mg">${mcards(REC)}</div></div>`}

function locations(){return`<h2>Choose a Location</h2><p class="sub">Pick the area closest to you.</p><div class="grid">${LOC.map((l,i)=>`<div class="card" onclick="pickLoc(${i})"><div style="font-size:40px">${l.e}</div><b>${l.n}</b><div>${l.t.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`).join('')}</div>`}
function want(i,keep){S={...S,mv:MV[i],th:keep?S.th:null,fth:keep?S.fth:null,sh:null,seats:[]};toast('🎬 '+MV[i].n);V='shows';render();scrollTo(0,0)}
function pickLoc(i){S={...S,loc:LOC[i],th:null,mv:null,sh:null,seats:[]};toast('📍 '+LOC[i].n+' selected');V='theatres';render()}
function theatres(){const l=S.loc;if(!l)return locations();return`<h2>Theatres in ${l.n}</h2><p class="sub">Tap a theatre to see what's playing.</p><div class="grid">${THS.filter(t=>t.l===l.n).map(t=>`<div class="card" onclick="pickTh(${t.i})"><div style="font-size:36px">🎭</div><b>${t.n}</b><div class="sub" style="margin:2px 0">📍 ${t.l}</div>${moviesOf(t).map(m=>`<span class="tag">${m.n}</span>`).join('')}</div>`).join('')}</div>`}
function pickTh(i){S={...S,th:THS[i],fth:THS[i],mv:null,sh:null,seats:[]};toast('🎭 '+THS[i].n+' selected');if(S.want&&moviesOf(THS[i]).some(m=>m.n===S.want)){const w=S.want;S.want=null;pickMv(w);return}V='movies';render()}
function mcards(list,keep){return list.map(n=>{const i=MV.findIndex(x=>x.n===n),m=MV[i],p=PS[n]||[n,'','#fff'],c=CL[n]||['UA','Hindi'];return`<div class="mc" onclick="want(${i},${keep?1:0})"><div class="mp" style="${bg(m)}">${IMG[n]?'':`<div class="rt" style="color:${p[2]}">${p[0]}</div><div class="rs">${p[1]}</div><div style="font-size:40px;margin-top:8px">${m.e}</div>`}</div><div class="mi"><b>${n}</b><span>${c[0]} | ${c[1]}</span><button class="btn">Book Now</button></div></div>`}).join('')}
function movies(){const t=S.th;return`<h2>${t?'Now Playing at '+t.n:'All Movies'}</h2><p class="sub">${t?'📍 '+t.l:'Pick a movie to see theatres and show timings'}</p><div class="mg">${mcards(t?moviesOf(t).map(m=>m.n):MV.map(m=>m.n),!!t)}</div>`}
function pickMv(n){S={...S,mv:MV.find(m=>m.n===n),sh:null,seats:[]};V='shows';render()}
const FLS={m:[0],a:[1],e:[2,3]};
function shows(){const m=S.mv,c=CL[m.n]||['UA','Hindi'];
let ths=THS.filter(t=>moviesOf(t).includes(m));if(S.fth)ths=ths.filter(t=>t===S.fth);if(S.loc)ths=ths.filter(t=>t.l===S.loc.n);
const idx=S.fl?FLS[S.fl]:[0,1,2,3];
const rows=ths.map(t=>`<div class="tr"><div class="th"><div class="tl">🎭</div><div><b>${t.n}</b><div class="sub" style="margin:0;font-size:12px">${t.l} · ${(t.i*1.7+1.2).toFixed(1)} km away</div><span class="tag ok">Allows cancellation</span></div></div><div class="tp">${idx.map(i=>{const sh=SH[i],[st,en]=sh.split(' – '),b=userBooked(sh,t),r=rng([t.n,m.n,dl(S.dt),sh,'a'].join())(),cl=b?'b':r<.5?'g':r<.8?'o':'r';return`<div class="pw"><button class="pill ${cl}" ${b?'title="Already booked by you"':''} onclick="pickSh(${i},${t.i})">${st}</button><small>${b?'Booked':'till '+en}</small></div>`}).join('')}</div></div>`).join('');
const fc=(k,n)=>`<button class="chip ${S.fl===k?'on':''}" onclick="S.fl=S.fl==='${k}'?null:'${k}';render()">${n}</button>`;
return`<div class="mh"><div class="mpo" style="${bg(m)}">${IMG[m.n]?'':m.e}</div><div><h2 style="margin:0">${m.n} <span class="sub">(2026)</span></h2><div class="sub" style="margin:4px 0">${m.d} · ${m.g}</div><span class="tag">${c[0]}</span><span class="tag">${c[1]}</span></div></div>
<div class="ds">${DT.map((d,i)=>`<button class="dc ${S.dt===i?'on':''}" onclick="S.dt=${i};render()"><small>${d.toLocaleDateString('en-IN',{weekday:'short'}).toUpperCase()}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('en-IN',{month:'short'})}</small></button>`).join('')}</div>
<div class="chips"><button class="chip ${!S.loc&&!S.fth?'on':''}" onclick="S.loc=null;S.fth=null;render()">All areas</button>${LOC.map((l,i)=>`<button class="chip ${S.loc===l?'on':''}" onclick="S.loc=LOC[${i}];S.fth=null;render()">${l.n}</button>`).join('')}</div>
<div class="chips">${fc('m','Morning')}${fc('a','Afternoon')}${fc('e','After 5 PM')}<span class="legend" style="margin:0 0 0 8px"><span><i style="background:var(--ok)"></i>Available</span><span><i style="background:#f59e0b"></i>Filling fast</span><span><i style="background:#ef4444"></i>Almost full</span></span></div>
${rows||'<p class="sub">No theatres match these filters.</p>'}
<h3 style="margin-top:28px">FAQs</h3>${[['Where can I watch '+m.n+'?','Choose any theatre above, pick a show time and select seats.'],['What is the runtime of '+m.n+'?','The runtime is '+m.d+'.'],['What is the censor rating?','It is rated '+c[0]+'.'],['What languages is it available in?',c[1]+'.'],['Can I cancel my ticket?','Theatres marked "Allows cancellation" support cancellation.']].map(q=>`<details class="fq"><summary>${q[0]}</summary><p class="sub">${q[1]}</p></details>`).join('')}`}
function pickSh(i,ti){const t=THS[ti],s=SH[i];if(userBooked(s,t)){const n=SH.find(x=>!userBooked(x,t));M('🚫','Show already booked','You already booked <b>'+S.mv.n+'</b> at '+t.n+' for '+s+' on '+dl(S.dt)+'. The same show cannot be booked twice.'+(n?'<br><br>Next available show: <b>'+n+'</b>':''),(n?'<button class="btn" onclick="cm();pickSh('+SH.indexOf(n)+','+ti+')">Book next show</button>':'')+'<button class="btn g" onclick="cm()">Close</button>');return}
S.th=t;S.sh=s;S.seats=[];S.sc=0;toast('⏰ '+t.n+' · '+s);V='seats';render()}
function seats(){return`<h2>Select Screen & Seats</h2><p class="sub">${S.mv.n} · ${S.th.n} · ${dl(S.dt)} · ${S.sh}</p><div class="chips">${SC.map((c,i)=>`<button class="chip ${S.sc===i?'on':''}" onclick="pickSc(${i})">Screen ${i+1} · ${c} seats</button>`).join('')}</div>
<div class="legend"><span><i style="background:var(--seat)"></i>Available</span><span><i style="background:var(--ok)"></i>Selected</span><span><i style="background:#c0c3d0;opacity:.5"></i>Booked</span></div>
<div class="screen"></div><p class="sub" style="text-align:center;font-size:12px">ALL EYES THIS WAY · SCREEN</p><div class="hall" id="hall"></div>
<div class="bar"><div><b id="cnt">0 seats</b> <span class="sub" id="lst"></span><div style="font-size:20px;font-weight:800" id="tot">₹0</div></div><button class="btn" id="bn" onclick="bookNow()" disabled>Book Now</button></div>`}
function pickSc(i){S.sc=i;S.seats=[];toast('🖥️ Screen '+(i+1)+' · '+SC[i]+' seats');render()}
function paintSeats(){const t=taken(key()),n=SC[S.sc];let h='';for(let r=0;r*PER<n;r++){h+=`<div class="row"><span class="rl">${rowL(r)}</span>`;for(let c=0;c<PER&&r*PER+c<n;c++){const id=rowL(r)+(c+1),b=t.has(id);h+=`<button class="s ${b?'bk':''} ${S.seats.includes(id)?'sel':''}" ${b?'disabled':''} onclick="tog(this,'${id}')">${id}</button>`}h+='</div>'}$('hall').innerHTML=h;sum()}
function tog(el,id){const i=S.seats.indexOf(id);if(i>-1){S.seats.splice(i,1);el.classList.remove('sel');toast('Seat '+id+' removed')}else{if(S.seats.length>=10){toast('⚠️ Maximum 10 seats per booking');return}S.seats.push(id);el.classList.add('sel');toast('💺 Seat '+id+' · ₹'+PR)}sum()}
function sum(){const n=S.seats.length;$('cnt').textContent=n+(n===1?' seat':' seats');$('lst').textContent=S.seats.join(', ');$('tot').textContent='₹'+n*PR;$('bn').disabled=!n}
function bookNow(){M('🎟️','Confirm your seats',kv('Movie',S.mv.n)+kv('Theatre',S.th.n)+kv('Screen',S.sc+1)+kv('Date',dl(S.dt))+kv('Show',S.sh)+kv('Seats',S.seats.join(', '))+kv('Total',n$()),'<button class="btn g" onclick="cm()">Edit</button><button class="btn" onclick="cm();go(\'book\')">Proceed to Pay</button>')}
const n$=()=>'₹'+S.seats.length*PR;
const PMS=[['Paytm UPI','💙'],['Google Pay','🟢'],['PhonePe','🟣'],['Other UPI','🏦']];
function book(){return`<h2>Payment</h2><p class="sub">${S.seats.length} seat(s) × ₹${PR} = <b>${n$()}</b></p><div class="card" style="cursor:default">${kv('Movie',S.mv.n)+kv('Theatre',S.th.n+', '+S.th.l)+kv('Screen',S.sc+1)+kv('Date',dl(S.dt))+kv('Show',S.sh)+kv('Seats',S.seats.join(', '))}</div>
<h3>Choose UPI app</h3><div class="pay">${PMS.map(([n,e])=>`<div class="pm ${S.pm===n?'on':''}" onclick="S.pm='${n}';render()"><div style="font-size:28px">${e}</div>${n}</div>`).join('')}</div>
${S.pm==='Other UPI'?'<input id="upi" placeholder="yourname@upi" style="margin-bottom:12px">':''}<button class="btn" onclick="pay()">Pay ${n$()}</button>`}
function pay(){if(!S.pm){M('💳','Choose a payment method','Select a UPI option to continue.');return}
if(S.pm==='Other UPI'&&!/^[\w.\-]+@[\w]+$/.test(($('upi')||{}).value||'')){M('⚠️','Invalid UPI ID','Enter a valid UPI ID like name@upi.');return}
M('⏳','Processing payment','<div class="spin"></div>Requesting '+S.pm+'…','');setTimeout(done,1600)}
function done(){const k=key();const bk={id:'CMX'+Date.now().toString().slice(-7),k,mv:S.mv.n,th:S.th.n,loc:S.th.l,sc:S.sc+1,sh:S.sh,dt:dl(S.dt),seats:[...S.seats],pm:S.pm,amt:S.seats.length*PR,rate:0};B.unshift(bk);save();
M('✅','Booking Confirmed!',kv('Booking ID',bk.id)+kv('Movie',bk.mv)+kv('Theatre',bk.th)+kv('Location',bk.loc)+kv('Screen',bk.sc)+kv('Date',bk.dt)+kv('Show',bk.sh)+kv('Seats',bk.seats.join(', '))+kv('No. of seats',bk.seats.length)+kv('Price / seat','₹'+PR)+kv('Total','₹'+bk.amt)+kv('Payment',bk.pm)+kv('Status','<span style="color:var(--ok)">CONFIRMED</span>'),`<button class="btn" onclick="rate('${bk.id}')">Rate Experience ⭐</button>`);
S={...S,sh:null,seats:[],pm:null};V='mine'}
let RT=0;
function rate(id){RT=0;M('⭐','Rate your booking','<div class="stars" style="text-align:center" id="st">'+[1,2,3,4,5].map(i=>`<span onclick="star(${i})">★</span>`).join('')+'</div><textarea id="fb" rows="3" placeholder="Optional feedback…" style="margin-top:10px"></textarea>',`<button class="btn g" onclick="cm();render()">Skip</button><button class="btn" onclick="sendRate('${id}')">Submit</button>`)}
function star(n){RT=n;[...$('st').children].forEach((s,i)=>s.className=i<n?'on':'')}
function sendRate(id){if(!RT){toast('Tap a star first');return}const b=B.find(x=>x.id===id);b.rate=RT;b.fb=$('fb').value;save();M('🙏','Thank you!','You rated your experience '+'★'.repeat(RT)+'. We appreciate your feedback.','<button class="btn" onclick="cm();go(\'mine\')">View My Bookings</button>')}
function mine(){if(!B.length)return`<h2>My Bookings</h2><p class="sub">No bookings yet.</p><button class="btn" onclick="go('locations')">Book a ticket</button>`;
return`<h2>My Bookings</h2><p class="sub">View your tickets or cancel a booking.</p><div class="grid">${B.map(b=>{const x=b.st==='x';return`<div class="card" style="cursor:default;${x?'opacity:.7':''}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${b.mv}</b><span class="tag ${x?'no':'ok'}">${x?'CANCELLED':'CONFIRMED'}</span></div><div class="sub" style="margin:2px 0">${b.th} · ${b.loc}</div>${kv('Screen',b.sc)+kv('Date',b.dt)+kv('Show',b.sh)+kv('Seats',b.seats.join(', '))+kv(x?'Refund':'Paid','₹'+b.amt+' · '+b.pm)}<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="tag">${b.id}</span>${x?'':(b.rate?'<span class="tag">'+'★'.repeat(b.rate)+'</span>':`<button class="chip" onclick="rate('${b.id}')">Rate</button>`)+`<button class="btn cx" onclick="cancelAsk('${b.id}')">Cancel Ticket</button>`}</div></div>`}).join('')}</div>`}
function cancelAsk(id){const b=B.find(x=>x.id===id);M('⚠️','Cancel Ticket','<p style="text-align:center;font-size:16px;color:var(--tx);margin:0 0 12px"><b>Are you sure you want to cancel this ticket?</b></p>'+kv('Movie',b.mv)+kv('Theatre',b.th)+kv('Date',b.dt)+kv('Show',b.sh)+kv('Seats',b.seats.join(', '))+kv('Refund','₹'+b.amt),`<button class="btn g" onclick="cm()">No, Keep It</button><button class="btn cx" onclick="cancelDo('${id}')">Yes, Cancel</button>`)}
function cancelDo(id){const b=B.find(x=>x.id===id);b.st='x';save();M('✅','Ticket Cancelled Successfully','<p style="text-align:center;margin:0 0 10px">Your booking <b>'+b.id+'</b> has been cancelled.</p>'+kv('Seats released',b.seats.join(', '))+kv('Refund','₹'+b.amt+' to '+b.pm)+'<p style="text-align:center;margin:10px 0 0">The seats are now available for other users.</p>','<button class="btn" onclick="cm();render()">Done</button>');render()}
render();
</script></body></html>
